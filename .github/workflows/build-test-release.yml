name: Build, test and release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      bump_level:
        description: Version increment level
        type: choice
        options: [patch, minor, major]
        default: minor

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # finish publication on main. Other refs can discard superseded work.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RELEASE_FILES: |-
    gcv-linux-x64
    gcv-linux-x64.debug
    gcv-linux-arm64
    gcv-linux-arm64.debug
    gcv-windows-x64.exe
    gcv-windows-x64.pdb
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux desktop development packages
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev mesa-vulkan-drivers
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --all-features
        env:
          GCV_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '' }}
      - name: Check the OpenGL viewport
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: gl
          EGL_PLATFORM: surfaceless
          GCV_REQUIRE_GPU: '1'
        run: cargo test --locked --all-features --lib renderer::viewport::tests
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo build --locked --release

  plan-release:
    # avoid expensive optimized builds when this run cannot publish a release.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip release]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Plan release version
        id: version
        env:
          BUMP_LEVEL: ${{ inputs.bump_level || 'patch' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(sed -n '/^\[package\]$/,/^\[dependencies\]$/s/^version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a package version in x.y.z form; got '$current'."
            exit 1
          fi
          # an interrupted release can archive a build before its version is committed.
          archive_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "build-archive") | .id')"
          archived_versions=''
          if [[ -n "$archive_id" ]]; then
            archived_versions="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$archive_id/assets?per_page=100" \
              --jq '.[] | .name | capture("^gcv-(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)-") | .version')"
          fi
          current="$(printf '%s\n' "$current" "$archived_versions" | sort -V | tail -n 1)"
          IFS='.' read -r major minor patch <<< "$current"
          case "$BUMP_LEVEL" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::Unsupported version increment '$BUMP_LEVEL'."; exit 1 ;;
          esac
          version="$major.$minor.$patch"
          previous_tag="$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found++')"
          {
            echo "version=$version"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: gcv-linux-x64
            symbols: gcv-linux-x64.debug
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: gcv-linux-arm64
            symbols: gcv-linux-arm64.debug
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: gcv-windows-x64.exe
            symbols: gcv-windows-x64.pdb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      BINARY: ${{ matrix.binary }}
      SYMBOLS: ${{ matrix.symbols }}
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop development packages
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: Build release binary
        env:
          VERSION: ${{ needs.plan-release.outputs.version }}
          # Let Windows debuggers find the published PDB beside the executable.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static -C link-arg=/PDBALTPATH:${{ matrix.symbols }}
          CARGO_PROFILE_RELEASE_DEBUG: '2'
          CARGO_PROFILE_RELEASE_STRIP: none
        run: |
          sed -i '/^\[package\]$/,/^\[dependencies\]$/s/^version = ".*"$/version = "'"$VERSION"'"/' Cargo.toml
          sed -i '/^name = "gcv"$/,/^\[\[package\]\]$/s/^version = ".*"$/version = "'"$VERSION"'"/' Cargo.lock
          cargo build --locked --release --target "$CARGO_BUILD_TARGET" --bin gcv
          mkdir -p release-assets
      - name: Package Linux binary and symbols
        if: runner.os == 'Linux'
        run: |
          executable="release-assets/$BINARY"
          cp "target/$CARGO_BUILD_TARGET/release/gcv" "$executable"
          objcopy --only-keep-debug --compress-debug-sections=zlib-gabi "$executable" "$executable.debug"
          strip --strip-all "$executable"
          objcopy --add-gnu-debuglink="$executable.debug" "$executable"
      - name: Package Windows binary and symbols
        if: runner.os == 'Windows'
        run: |
          cp "target/$CARGO_BUILD_TARGET/release/gcv.exe" "release-assets/$BINARY"
          cp "target/$CARGO_BUILD_TARGET/release/gcv.pdb" "release-assets/$SYMBOLS"
      - name: Smoke-test the release binary
        env:
          VERSION: ${{ needs.plan-release.outputs.version }}
        run: |
          executable="./release-assets/$BINARY"
          test -s "release-assets/$SYMBOLS"
          [[ "$("$executable" --version | tr -d '\r')" == "gcv $VERSION" ]]
          input=tests/fixtures/bgcode/heatshrink12-meatpack-v1.bgcode
          "$executable" "$input" --stats | jq -e '.total_segments > 0'
          png="$RUNNER_TEMP/preview.png"
          env -u DISPLAY -u WAYLAND_DISPLAY "$executable" "$input" --no-bed -r 320x225 -e "$png"
          # PNG signature and IHDR, followed by the width and height.
          printf '\211PNG\r\n\032\n\0\0\0\rIHDR' | cmp -n 16 - "$png"
          read -r width height < <(od -An -tu4 --endian=big -j16 -N8 "$png")
          [[ "$width" == 320 && "$height" == 225 ]]
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.binary }}
          path: |
            release-assets/${{ matrix.binary }}
            release-assets/${{ matrix.symbols }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v6
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: release-version
          path: |
            Cargo.toml
            Cargo.lock
          if-no-files-found: error
          retention-days: 7

  prepare:
    needs: [test, plan-release, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-version
          path: ${{ runner.temp }}/release-version
      - uses: actions/download-artifact@v8
        with:
          pattern: gcv-*
          merge-multiple: true
          path: release-assets
      - name: Archive, commit and tag the tested version
        id: push
        env:
          VERSION: ${{ needs.plan-release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --quiet
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo '::notice::Main advanced; skipping this release.'
            exit 0
          fi
          fail() { echo "::error::$*" >&2; exit 1; }
          api="repos/$GITHUB_REPOSITORY"
          work="$RUNNER_TEMP/build-archive"
          mkdir -p "$work"

          archive_tag="$(gh api --paginate "$api/releases?per_page=100" --jq '.[] | select(.tag_name == "build-archive") | .tag_name')"
          if [[ -z "$archive_tag" ]]; then
            gh release create build-archive --target "$GITHUB_SHA" --latest=false \
              --title 'Build archive' --notes 'Versioned binaries and debug symbols.'
          fi
          archive="$(gh api "$api/releases/tags/build-archive")"
          jq -e '.draft == false and .prerelease == false and (.immutable != true)' <<< "$archive" >/dev/null \
            || fail 'Build archive must be public and mutable, without a prerelease label.'
          archive_id="$(jq -r '.id' <<< "$archive")"

          find_asset() {
            gh api --paginate --slurp "$api/releases/$archive_id/assets?per_page=100" > "$work/assets.json" || return
            jq -c --arg name "$name" '.[][] | select(.name == $name)' "$work/assets.json"
          }
          archive_asset() {
            local file="$1" name="$2" digest asset recorded_digest asset_id
            test -s "$file" || fail "Missing or empty asset: $file"
            digest="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
            asset="$(find_asset)"
            if [[ -z "$asset" ]]; then
              [[ "$(jq '[.[][]] | length' "$work/assets.json")" -lt 1000 ]] \
                || fail "The archive has reached GitHub's 1,000-asset limit. Create a new archive before publishing."
              cp "$file" "$work/$name"
              # upload once; an existing version is never replaced.
              gh release upload build-archive "$work/$name" --repo "$GITHUB_REPOSITORY"
              asset="$(find_asset)"
              [[ -n "$asset" ]] || fail "Uploaded asset is missing: $name"
            fi

            recorded_digest="$(jq -r '.digest // empty' <<< "$asset")"
            if [[ ! "$recorded_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              asset_id="$(jq -r '.id' <<< "$asset")"
              gh api -H 'Accept: application/octet-stream' "$api/releases/assets/$asset_id" > "$work/download"
              recorded_digest="sha256:$(sha256sum "$work/download" | cut -d ' ' -f 1)"
            fi
            [[ "$recorded_digest" == "$digest" ]] || fail "Archived bytes differ: $name. Nothing will be overwritten."
          }
          while IFS= read -r file; do
            archive_asset "release-assets/$file" "gcv-$VERSION-${file#gcv-}"
          done <<< "$RELEASE_FILES"
          cp "$RUNNER_TEMP/release-version/Cargo.toml" Cargo.toml
          cp "$RUNNER_TEMP/release-version/Cargo.lock" Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "gcv $VERSION [release] [skip ci]"
          git fetch origin main --quiet
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo '::notice::Main advanced during archiving; keeping the archived build and skipping publication.'
            exit 0
          fi
          git tag "v$VERSION"
          # a normal atomic push rejects branch races and leaves neither ref half-updated.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    needs: [plan-release, prepare]
    if: needs.prepare.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      VERSION: ${{ needs.plan-release.outputs.version }}
      PREVIOUS_TAG: ${{ needs.plan-release.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: gcv-*
          merge-multiple: true
          path: release-assets
      - name: Prepare release notes
        run: |
          notes=release-notes.md
          repo_url="https://github.com/$GITHUB_REPOSITORY"
          declare -A since=()
          if [[ -n "$PREVIOUS_TAG" ]]; then
            while read -r sha; do
              since["$sha"]=1
            done < <(git rev-list "$PREVIOUS_TAG..$RELEASE_SHA")
          fi

          cat > "$notes" <<MD
          This is a rolling release. Whenever all tests pass on main, it is
          automatically updated to point to the latest release tag.

          Installation
          --------------
          Windows x64: [Download gcv-windows-x64.exe]($repo_url/releases/download/release/gcv-windows-x64.exe)

          Linux x64 and ARM64 (built on Ubuntu 24.04 with glibc). To run on x64:

          \`\`\`sh
          curl -fL -o gcv $repo_url/releases/download/release/gcv-linux-x64
          chmod +x gcv
          ./gcv model.gcode
          \`\`\`

          [Previous builds]($repo_url/releases/tag/build-archive)

          Latest changes
          --------------
          | Author | Release | Commit | SHA |
          | ------ | ------- | ------ | --- |
          MD

          # one API request supplies author profiles for the whole table.
          gh api "repos/$GITHUB_REPOSITORY/commits?sha=$RELEASE_SHA&per_page=24" > "$RUNNER_TEMP/commits.json"
          mapfile -t rel_tags < <(git for-each-ref --sort=creatordate --format='%(refname:short)' refs/tags | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/')
          declare -A tag_commits=()
          for tag in "${rel_tags[@]}"; do tag_commits["$tag"]="$(git rev-list -n 1 "$tag")"; done
          count=0
          while IFS=$'\t' read -r sha msg author email; do
            if [[ "${author,,}" == 'github-actions[bot]' || "${email,,}" == '41898282+github-actions[bot]@users.noreply.github.com' ]]; then continue; fi
            shortlink="[${sha:0:7}]($repo_url/commit/$sha)"
            msg="${msg//|/\\|}"
            info="$(jq -c --arg sha "$sha" 'first(.[] | select(.sha == $sha)) | {login:(.author.login // .committer.login), profile:(.author.html_url // .committer.html_url), avatar:(.author.avatar_url // .committer.avatar_url)}' "$RUNNER_TEMP/commits.json")"
            login="$(jq -r '.login // empty' <<< "$info")"
            profile="$(jq -r '.profile // empty' <<< "$info")"
            avatar="$(jq -r '.avatar // empty' <<< "$info")"
            if [[ -z "$avatar" ]]; then
              if [[ -n "$email" ]]; then
                hash="$(printf '%s' "${email,,}" | md5sum | cut -d ' ' -f 1)"
                base="www.gravatar.com/avatar/$hash?d=identicon"
              else
                base='www.gravatar.com/avatar/?d=mp'
              fi
              avatar="https://wsrv.nl/?url=${base}&w=48&h=48&mask=circle&fit=cover&maxage=1w"
            fi
            author="${author//|/\\|}"
            author="${author%\[bot\]}"
            if [[ -n "$login" && -n "$profile" ]]; then
              author_cell="<a href=\"$profile\"><img src=\"$avatar\" width=\"24\" height=\"24\" /></a> @${login%\[bot\]}"
            else
              author_cell="<img src=\"$avatar\" width=\"24\" height=\"24\" /> $author"
            fi
            version='-'
            for tag in "${rel_tags[@]}"; do
              if git merge-base --is-ancestor "$sha" "${tag_commits[$tag]}"; then
                version="$tag"
                break
              fi
            done
            if [[ -n "${since[$sha]:-}" ]]; then version="$version ✨"; fi
            printf '| %s | %s | %s | %s |\n' "$author_cell" "$version" "$msg" "$shortlink" >> "$notes"
            count=$((count + 1))
            if [[ "$count" -ge 16 ]]; then break; fi
          done < <(git log -n 24 "$RELEASE_SHA" --pretty=format:%H%x09%s%x09%an%x09%ae; echo)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            printf '\n#### [View diff since previous tagged release](%s/compare/%s...release)\n' "$repo_url" "$PREVIOUS_TAG" >> "$notes"
          fi
          printf '\n#### [More recent commits](%s/commits/main/)\n' "$repo_url" >> "$notes"
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify release target
        id: verify
        run: |
          git fetch origin main --quiet
          if [[ "$(git rev-parse origin/main)" != "$RELEASE_SHA" ]]; then
            echo '::notice::Main advanced; leaving the rolling release unchanged.'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            printf '\n### Release skipped\n\nMain no longer points to the release commit.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update rolling release
        if: steps.verify.outputs.changed == 'false'
        run: |
          mapfile -t names <<< "$RELEASE_FILES"
          files=("${names[@]/#/release-assets/}")
          for file in "${files[@]}"; do test -s "$file"; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -fa release "$RELEASE_SHA" -m 'Latest rolling release'
          git push -f origin refs/tags/release

          if gh release view release >/dev/null 2>&1; then
            gh release edit release --title "v$VERSION" --notes-file release-notes.md
          else
            gh release create release --title "v$VERSION" --notes-file release-notes.md --target "$RELEASE_SHA" --draft
          fi
          gh release upload release "${files[@]}" --clobber
          assets="$(gh release view release --json assets)"
          mapfile -t published < <(jq -r '.assets[].name' <<< "$assets")
          for asset in "${published[@]}"; do
            if ! grep -Fxq -- "$asset" <<< "$RELEASE_FILES"; then
              gh release delete-asset release "$asset" --yes
            fi
          done

          info="$(gh release view release --json apiUrl,publishedAt)"
          release_api="$(jq -r '.apiUrl' <<< "$info")"
          previous_date="$(jq -r '.publishedAt // ""' <<< "$info")"
          # republish the same release to refresh its date without losing reactions.
          trap 'echo "::warning::Release refresh failed; retrying publication."; gh api --method PATCH "$release_api" -f tag_name=release -F draft=false -f make_latest=true >/dev/null' EXIT
          gh api --method PATCH "$release_api" -f tag_name=release -F draft=true >/dev/null
          refreshed="$(gh api --method PATCH "$release_api" -f tag_name=release -F draft=false -f make_latest=true)"
          trap - EXIT
          if ! jq -e --arg previous "$previous_date" '.tag_name == "release" and .draft == false and .published_at > $previous' <<< "$refreshed" >/dev/null; then
            echo '::error::Release tag or publication date is incorrect.'
            exit 1
          fi
          echo "Release publication date: $(jq -r '.published_at' <<< "$refreshed")" >> "$GITHUB_STEP_SUMMARY"
