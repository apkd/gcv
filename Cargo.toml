[package]
name = "gcv"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
description = "3D G-code toolpath viewer with interactive GUI and CLI PNG export"
license-file = "LICENSE"
readme = "README.md"
keywords = ["gcode", "bgcode", "3d-printing", "viewer"]
categories = ["visualization", "command-line-utilities"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:bytemuck", "dep:wgpu"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1.12"
memchr = "2"
serde_json = "1.0"
eframe = { version = "=0.31.1", optional = true, default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
bytemuck = { version = "1", optional = true, features = ["derive"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "24", optional = true, default-features = false, features = ["dx12"] }

[dev-dependencies]
pollster = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
